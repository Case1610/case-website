name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 受け取り側の検査が効いていること、そしてプロフィールがバンドルへ
      # 焼き込まれる経路に戻っていないことを確かめる。落ちたらデプロイまで進ませない
      - run: npm run verify:boundary

      # ビルドにプロフィールの入力は要らない。中身は実行時に層2（R2）から取りに行く。
      # PROFILE_JSON_B64 は 2026-09-13 に廃止した（docs/profile-privacy.md）
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

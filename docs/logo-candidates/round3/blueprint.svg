  <text x="1200" y="206" font-size="21" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="400">A = 1000</text>
  <line x1="891" y1="140" x2="1509" y2="140" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="891" y1="130" x2="891" y2="150" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="1509" y1="130" x2="1509" y2="150" stroke="#1c1f24" stroke-width="1.5"/>
  <text x="1200" y="124" font-size="21" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="400">H = A / φ = 618</text>
  <line x1="700" y1="1378" x2="891" y2="1378" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="700" y1="1368" x2="700" y2="1388" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="891" y1="1368" x2="891" y2="1388" stroke="#1c1f24" stroke-width="1.5"/>
  <text x="795.5" y="1362" font-size="21" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="400">M = 191</text>
  <line x1="891" y1="1378" x2="1037" y2="1378" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="891" y1="1368" x2="891" y2="1388" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="1037" y1="1368" x2="1037" y2="1388" stroke="#1c1f24" stroke-width="1.5"/>
  <text x="964" y="1362" font-size="21" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="400">S = 146</text>
  <line x1="1037" y1="1460" x2="1363" y2="1460" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="1037" y1="1450" x2="1037" y2="1470" stroke="#1c1f24" stroke-width="1.5"/>
  <line x1="1363" y1="1450" x2="1363" y2="1470" stroke="#1c1f24" stroke-width="1.5"/>
  <text x="1200" y="1444" font-size="21" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="400">中身 = H − 2S = 326</text>
  <line x1="1990" y1="682" x2="1990" y2="918" stroke="#3f69d3" stroke-width="1.5"/>
  <line x1="1980" y1="682" x2="2000" y2="682" stroke="#3f69d3" stroke-width="1.5"/>
  <line x1="1980" y1="918" x2="2000" y2="918" stroke="#3f69d3" stroke-width="1.5"/>
  <text x="2010" y="807" font-size="21" font-family="sans-serif" fill="#3f69d3" text-anchor="start" font-weight="400">TAB = H / φ² = 236</text>
  <text x="70" y="92" font-size="40" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">ShowCase — construction</text>
  <text x="70" y="136" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">2026-09-13</text>
  <line x1="70" y1="170" x2="600" y2="170" stroke="#c2c8d2" stroke-width="1.5"/>
  <text x="70" y="226" font-size="24" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">考え方</text>
  <text x="70" y="268" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">箱（外枠）と中身（内側の面）は同じ色。</text>
  <text x="70" y="302" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">そのあいだにできた白い隙間だけが C の形をしている。</text>
  <text x="70" y="336" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400"></text>
  <text x="70" y="370" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">右側で隙間が途切れ、そこで中身が箱につながる。</text>
  <text x="70" y="404" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">これが仕立ての合わせ目であり、C の開口部でもある。</text>
  <text x="70" y="438" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400"></text>
  <text x="70" y="472" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">中身を抜くと隙間はただの四角に戻り、C は消える。</text>
  <text x="70" y="506" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">置くことではじめて名前になる。</text>
  <text x="70" y="620" font-size="24" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">寸法の連鎖</text>
  <text x="70" y="664" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">A</text>
  <text x="150" y="664" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="400">= 1000</text>
  <text x="380" y="664" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">外形の一辺。すべての出発点</text>
  <text x="70" y="702" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">H</text>
  <text x="150" y="702" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="400">= A / φ = 618</text>
  <text x="380" y="702" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">中身の一辺・文字の高さ</text>
  <text x="70" y="740" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">M</text>
  <text x="150" y="740" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="400">= (A − H) / 2 = 191</text>
  <text x="380" y="740" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">箱の壁の厚み</text>
  <text x="70" y="778" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">S</text>
  <text x="150" y="778" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="400">= H / φ³ = 146</text>
  <text x="380" y="778" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">線の太さ</text>
  <text x="70" y="816" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">TAB</text>
  <text x="150" y="816" font-size="22" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="400">= H / φ² = 236</text>
  <text x="380" y="816" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">合わせ目（C の開口）</text>
  <text x="70" y="900" font-size="22" font-family="sans-serif" fill="#3f69d3" text-anchor="start" font-weight="400">φ = (1 + √5) / 2 = 1.6180339887…</text>
  <text x="70" y="940" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">この図はロゴと同じ定数から生成している。</text>
  <text x="70" y="972" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">別々に描くと、片方を直したときにもう片方が嘘になる。</text>
  <g transform="translate(70 1060) scale(0.2)">

  <text x="810" y="810" font-size="46" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="700">a</text>
  <text x="810" y="852" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="middle" font-weight="400">右に縦棒を足す</text>
  <line x1="1080" y1="210" x2="1080" y2="930" stroke="#d3d8e0"/>
  <circle cx="1330" cy="490" r="200" fill="none" stroke="#aab0bb" stroke-width="1.6" stroke-dasharray="7 7"/>
  <circle cx="1330" cy="490" r="124" fill="none" stroke="#aab0bb" stroke-width="1.6" stroke-dasharray="7 7"/>
  <line x1="1070" y1="490" x2="1590" y2="490" stroke="#aab0bb" stroke-width="1.6" stroke-dasharray="7 7"/>

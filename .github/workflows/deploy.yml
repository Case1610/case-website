name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 非公開項目がバンドルへ混入していたらここで止める（デプロイまで進ませない）
      - run: npm run verify:redaction

      # PROFILE_ALLOW_SAMPLE は付けない。Secret が無ければここで落ちる。
      # 架空の人物を黙って公開する経路を残さないため（Issue #6）。
      - run: npm run build
        env:
          PROFILE_JSON_B64: ${{ secrets.PROFILE_JSON_B64 }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

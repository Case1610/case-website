  <text x="1850" y="810" font-size="46" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="700">e</text>
  <text x="1850" y="852" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="middle" font-weight="400">横棒を入れて右下を開ける</text>
  <text x="60" y="96" font-size="42" font-family="sans-serif" fill="#1c1f24" text-anchor="start" font-weight="700">case — ひとつの円から</text>
  <text x="60" y="140" font-size="23" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">c・a・e は同じ円を違う切り方にしただけのもの。s だけが半径を半分にした2つの円から出る。</text>
  <text x="60" y="176" font-size="23" font-family="sans-serif" fill="#3f69d3" text-anchor="start" font-weight="400">外円の半径 R、線の太さ W = R / φ²。φ = (1 + √5) / 2</text>
  <text x="60" y="950" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">開口 AP = R × 0.9　（c と e で共通）</text>
  <text x="60" y="988" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">字間 = W × 1.4</text>
  <text x="60" y="1026" font-size="22" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">この図は書体と同じ関数から描いている。形を直せば図も直る。</text>
  <text x="60" y="1080" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">2026-09-13</text>
</svg>

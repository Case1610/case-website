  <text x="70" y="1290" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">空の箱</text>
  <text x="330" y="1290" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="start" font-weight="400">置くと C が現れる</text>

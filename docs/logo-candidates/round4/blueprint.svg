  <text x="1330" y="810" font-size="46" font-family="sans-serif" fill="#1c1f24" text-anchor="middle" font-weight="700">s</text>
  <text x="1330" y="852" font-size="21" font-family="sans-serif" fill="#4a4f58" text-anchor="middle" font-weight="400">半径を半分にして2つ</text>
  <line x1="1600" y1="210" x2="1600" y2="930" stroke="#d3d8e0"/>
  <circle cx="1850" cy="490" r="200" fill="none" stroke="#aab0bb" stroke-width="1.6" stroke-dasharray="7 7"/>
  <circle cx="1850" cy="490" r="124" fill="none" stroke="#aab0bb" stroke-width="1.6" stroke-dasharray="7 7"/>
